[project]
name = "ragwatson-backend"
version = "0.1.0"
description = "FastAPI backend — clean architecture + star-topology harness"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pycln>=2.4.0",
    "pre-commit>=4.0.0",
    "mypy>=1.13.0",
]

# ---------------------------------------------------------------------------
# Ruff — linter & formatter
# Hub/spoke/clean_modules isort sections keep star-topology imports ordered:
#   hub (registry/topology) → spokes (per-character plugins) → clean hex layers
# C901 (mccabe) caps cyclomatic complexity so harness wiring stays testable.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["apps", "core", "tests", "main.py"]
extend-exclude = ["*.py.py"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TID",
    "C90",  # mccabe complexity (C901)
]
ignore = [
    "E501",   # line-length handled by formatter
    "B008",   # FastAPI Depends() in parameter defaults
    "N803",   # sklearn / ML convention (X, y)
    "N806",   # ML matrix names (X_scaled, X_reduced)
    "N815",   # Pydantic / API camelCase field names
]

[tool.ruff.lint.per-file-ignores]
"**/apps/database.py" = ["F822"]  # lazy exports via __getattr__

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["core", "titanic", "siliconvalley", "audio", "user"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "hub",
    "spokes",
    "clean_modules",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
# Central hub: registries & ontology topology (no spoke business logic)
hub = [
    "siliconvalley.adapter.inbound.mcp.mcp_registry",
    "siliconvalley.adapter.inbound.api.router_registry",
    "siliconvalley.dependencies.providers",
    "siliconvalley.domain.hendricks_ceo_topology",
]
# Spoke plugins: one module per character/tool surface
spokes = [
    "siliconvalley.adapter.inbound.mcp.bighetti_hr_tools",
    "siliconvalley.adapter.inbound.mcp.dinesh_dash_tools",
    "siliconvalley.adapter.inbound.mcp.dunn_coo_tools",
    "siliconvalley.adapter.inbound.mcp.gilfoyle_system_tools",
    "siliconvalley.adapter.inbound.mcp.hendricks_ceo_tools",
]
# Linear clean-architecture packages (hexagonal layers per app)
clean_modules = [
    "siliconvalley.domain",
    "siliconvalley.app",
    "siliconvalley.adapter",
    "siliconvalley.dependencies",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ---------------------------------------------------------------------------
# Pytest — harness markers isolate hub, spoke, and integration wiring
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "apps/titanic/tests",
    "tests/harness",
]
pythonpath = [".", "apps"]
markers = [
    "hub: central hub module validation (registry, topology)",
    "spoke: individual spoke module validation in isolation",
    "harness: hub–spoke ontology interaction and integration harness",
    "ollama: 로컬 Ollama 서버와 pull 된 모델이 필요한 통합 테스트",
]
filterwarnings = [
    "ignore:Please use `import python_multipart`:PendingDeprecationWarning",
]

# ---------------------------------------------------------------------------
# pycln — strip unused imports to prevent ghost dependencies in ontology graph
# ---------------------------------------------------------------------------
[tool.pycln]
all = true

# ---------------------------------------------------------------------------
# mypy — strict type checking (type hints required)
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
